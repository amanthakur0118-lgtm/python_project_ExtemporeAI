<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Outer Soundwaves (AI Voice Aura) -->
  <path d="M 14 26 C 11 30 11 34 14 38" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 50 26 C 53 30 53 34 50 38" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M 9 22 C 5 28 5 36 9 42" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <path d="M 55 22 C 59 28 59 36 55 42" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Microphone Capsule Body -->
  <rect x="26" y="14" width="12" height="22" rx="6" fill="#ffffff" filter="url(#glow)" />
  <!-- Capsule mesh lines -->
  <line x1="28" y1="21" x2="36" y2="21" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" />
  <line x1="28" y1="25" x2="36" y2="25" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round" />

  <!-- Arc / Cradle -->
  <path d="M 21 27 C 21 37 43 37 43 27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Stand & Base -->
  <line x1="32" y1="37" x2="32" y2="46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="23" y1="46" x2="41" y2="46" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" />

  <!-- AI Pulse Star / Spark -->
  <path d="M 46 11 L 47.5 14.5 L 51 16 L 47.5 17.5 L 46 21 L 44.5 17.5 L 41 16 L 44.5 14.5 Z" fill="#fbbf24" />
</svg>